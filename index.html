<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Link Examples</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
        max-width: 600px;
        margin: 0 auto;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        margin: 8px 0;
        padding: 8px;
        background: #f5f5f5;
        border-radius: 4px;
      }
      a,
      .link {
        color: #0066cc;
        text-decoration: none;
        cursor: pointer;
      }
      a:hover,
      .link:hover {
        text-decoration: underline;
      }
      .controls {
        margin-bottom: 20px;
        padding: 12px;
        background: #e8f4f8;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <label>
        <input type="checkbox" id="paramCheckbox" />
        Add <code>?openInExternalApp=true</code> to all links
      </label>
    </div>

    <h2>Anchor Links</h2>
    <ul>
      <li><a class="link-target">No target</a></li>
      <li><a class="link-target" target="_blank">target="_blank"</a></li>
      <li><a class="link-target" target="_self">target="_self"</a></li>
      <li><a class="link-target" target="_parent">target="_parent"</a></li>
      <li><a class="link-target" target="_top">target="_top"</a></li>
    </ul>

    <h2>JavaScript Navigation</h2>
    <ul>
      <li><div class="link" onclick="navigate('href')">location.href</div></li>
      <li>
        <div class="link" onclick="navigate('assign')">location.assign()</div>
      </li>
      <li>
        <div class="link" onclick="navigate('replace')">location.replace()</div>
      </li>
      <li>
        <div class="link" onclick="navigate('open')">window.open()</div>
      </li>
    </ul>

    <h2>Native Integration</h2>
    <ul>
      <li>
        <div class="link" onclick="openExternal()">Open External Browser</div>
      </li>
    </ul>

    <script>
      const BASE = "https://google.com";
      const KEY = "externalAppFlag";

      const checkbox = document.getElementById("paramCheckbox");

      function url() {
        return checkbox.checked ? BASE + "?openInExternalApp=true" : BASE;
      }

      function updateLinks() {
        document
          .querySelectorAll(".link-target")
          .forEach((a) => (a.href = url()));
      }

      function navigate(method) {
        const targetUrl = url();
        if (method === "href") window.location.href = targetUrl;
        else if (method === "assign") window.location.assign(targetUrl);
        else if (method === "replace") window.location.replace(targetUrl);
        else if (method === "open") window.open(targetUrl, "_blank");
      }

      function openExternal() {
        const targetUrl = url();
        try {
          window.webkit.messageHandlers.openExternalBrowser.postMessage(
            targetUrl
          );
        } catch (e) {
          window.open(targetUrl, "_blank");
        }
      }

      checkbox.checked = localStorage.getItem(KEY) === "true";
      updateLinks();

      checkbox.onchange = () => {
        localStorage.setItem(KEY, checkbox.checked);
        updateLinks();
      };

      window.onstorage = (e) => {
        if (e.key === KEY) {
          checkbox.checked = e.newValue === "true";
          updateLinks();
        }
      };
    </script>
  </body>
</html>
